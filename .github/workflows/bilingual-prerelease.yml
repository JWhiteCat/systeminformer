name: bilingual-prerelease

on:
  push:
    tags: ['bilingual-v*-preview.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New immutable bilingual-vYYYY.MM.DD-preview.N tag'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bilingual-prerelease-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'JWhiteCat/systeminformer' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_SHA: ${{ github.sha }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      RELEASE_EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify immutable release target and successful CI
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^bilingual-v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-preview\.[1-9][0-9]*$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/master
          if [ "$RELEASE_EVENT" = workflow_dispatch ]; then
            test "$(git rev-parse origin/master)" = "$EXPECTED_SHA"
            test "$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq 'length')" = 0
          fi
          python3 tools/release/verify_ci.py --commit "$EXPECTED_SHA" >> "$GITHUB_ENV"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists. Inspect it before any manual retry.' >&2
            exit 1
          fi
      - name: Download exact verified build artifact
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN_ID" --name "systeminformer-prerelease-$EXPECTED_SHA" --dir release-assets
          python3 tools/release/prepare_release.py --verify --destination release-assets --commit "$EXPECTED_SHA"
      - name: Create new exact tag for manual publication
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/commits/master" --jq '.sha')" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq 'length')" = 0
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$EXPECTED_SHA"
      - name: Create complete draft prerelease and verify uploaded bytes
        shell: bash
        run: |
          set -euo pipefail
          cp docs/BILINGUAL-PREVIEW-NOTES.md release-notes.md
          printf '\n\nSource commit: `%s`\n\nWindows build: https://github.com/%s/actions/runs/%s\n' "$EXPECTED_SHA" "$GH_REPO" "$BUILD_RUN_ID" >> release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --latest=false \
            --title "System Informer 中英双语测试版 $RELEASE_TAG (Unofficial)" --notes-file release-notes.md
          gh release upload "$RELEASE_TAG" \
            release-assets/systeminformer-build-release-setup.exe \
            release-assets/systeminformer-build-win64-bin.zip \
            release-assets/SHA256SUMS.txt \
            release-assets/release-manifest.json
          gh release download "$RELEASE_TAG" --dir remote-verification
          python3 tools/release/prepare_release.py --verify --destination remote-verification --commit "$EXPECTED_SHA"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
